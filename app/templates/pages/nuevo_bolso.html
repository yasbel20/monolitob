<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BagShop | Añadir Bolso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="/">
          <i class="bi bi-handbag-fill me-2"></i>BagShop
        </a>
      </div>
    </nav>

    <main class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-md-10">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
              <h2 class="h4 mb-0 text-center text-dark">
                <i class="bi bi-plus-circle text-primary me-2"></i>Añadir Nuevo Bolso al Inventario
              </h2>
            </div>
            <div class="card-body p-4">
              
              {% if errores %}
              <div class="alert alert-danger">
                <ul class="mb-0">
                  {% for error in errores %}
                  <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              </div>
              {% endif %}

              <form action="/bolsos/nuevo" method="POST" class="row g-3">
                
                <div class="col-md-6">
                  <label class="form-label fw-bold">Nombre del Bolso</label>
                  <input type="text" name="nombre" class="form-control" placeholder="Ej. Bolso Clásico Elegante" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Marca</label>
                  <input type="text" name="marca" class="form-control" placeholder="Ej. Prada, Michael Kors..." required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Tipo de Bolso</label>
                  <select name="tipo" class="form-select" required>
                    <option value="bolso_mano">Bolso de Mano</option>
                    <option value="bandolera">Bandolera</option>
                    <option value="mochila">Mochila</option>
                    <option value="clutch">Clutch</option>
                    <option value="tote">Tote</option>
                    <option value="riñonera">Riñonera</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Material</label>
                  <input type="text" name="material" class="form-control" placeholder="Ej. Cuero genuino" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Color</label>
                  <input type="text" name="color" class="form-control" placeholder="Ej. Negro, Marrón..." required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Precio (€)</label>
                  <input type="number" step="0.01" name="precio" class="form-control" placeholder="0.00" min="0.01" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Stock</label>
                  <input type="number" name="stock" class="form-control" min="0" value="0" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Talla</label>
                  <select name="talla" class="form-select" required>
                    <option value="pequeño">Pequeño</option>
                    <option value="mediano" selected>Mediano</option>
                    <option value="grande">Grande</option>
                    <option value="xl">XL</option>
                  </select>
                </div>

                <div class="col-md-12">
                  <label class="form-label fw-bold">Temporada</label>
                  <div class="mt-2">
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="primavera_verano" />
                      <label class="form-check-label">Primavera/Verano</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="otoño_invierno" />
                      <label class="form-check-label">Otoño/Invierno</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="todo_el_año" checked />
                      <label class="form-check-label">Todo el Año</label>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold">Descripción</label>
                  <textarea name="descripcion" class="form-control" rows="3" placeholder="Describe las características del bolso..." required></textarea>
                </div>

                <div class="col-12 mt-4 pt-3 border-top text-center">
                  <a href="/" class="btn btn-light me-2">Cancelar</a>
                  <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                    <i class="bi bi-save me-2"></i>Guardar Bolso
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center text-muted py-4">
      <small>&copy; 2026 BagShop</small>
    </footer>
  </body>
</html>
