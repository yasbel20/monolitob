<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BagShop | Editar Bolso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="/">
          <i class="bi bi-handbag-fill me-2"></i>BagShop
        </a>
      </div>
    </nav>

    <main class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-md-10">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom text-center">
              <h2 class="h4 mb-0 text-dark">
                <i class="bi bi-pencil-square text-warning me-2"></i>Editar Bolso #{{ bolso.id }}
              </h2>
            </div>
            <div class="card-body p-4">
              
              {% if errores %}
              <div class="alert alert-danger">
                <ul class="mb-0">
                  {% for error in errores %}
                  <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              </div>
              {% endif %}

              <form action="/bolsos/editar/{{ bolso.id }}" method="POST" class="row g-3">
                
                <div class="col-md-6">
                  <label class="form-label fw-bold">Nombre del Bolso</label>
                  <input type="text" name="nombre" class="form-control" value="{{ bolso.nombre }}" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Marca</label>
                  <input type="text" name="marca" class="form-control" value="{{ bolso.marca }}" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Tipo de Bolso</label>
                  <select name="tipo" class="form-select" required>
                    <option value="bolso_mano" {% if bolso.tipo == 'bolso_mano' %}selected{% endif %}>Bolso de Mano</option>
                    <option value="bandolera" {% if bolso.tipo == 'bandolera' %}selected{% endif %}>Bandolera</option>
                    <option value="mochila" {% if bolso.tipo == 'mochila' %}selected{% endif %}>Mochila</option>
                    <option value="clutch" {% if bolso.tipo == 'clutch' %}selected{% endif %}>Clutch</option>
                    <option value="tote" {% if bolso.tipo == 'tote' %}selected{% endif %}>Tote</option>
                    <option value="riñonera" {% if bolso.tipo == 'riñonera' %}selected{% endif %}>Riñonera</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Material</label>
                  <input type="text" name="material" class="form-control" value="{{ bolso.material }}" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Color</label>
                  <input type="text" name="color" class="form-control" value="{{ bolso.color }}" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Precio (€)</label>
                  <input type="number" step="0.01" name="precio" class="form-control" value="{{ bolso.precio }}" min="0.01" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Stock</label>
                  <input type="number" name="stock" class="form-control" value="{{ bolso.stock }}" min="0" required />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bold">Talla</label>
                  <select name="talla" class="form-select" required>
                    <option value="pequeño" {% if bolso.talla == 'pequeño' %}selected{% endif %}>Pequeño</option>
                    <option value="mediano" {% if bolso.talla == 'mediano' %}selected{% endif %}>Mediano</option>
                    <option value="grande" {% if bolso.talla == 'grande' %}selected{% endif %}>Grande</option>
                    <option value="xl" {% if bolso.talla == 'xl' %}selected{% endif %}>XL</option>
                  </select>
                </div>

                <div class="col-md-12">
                  <label class="form-label fw-bold">Temporada</label>
                  <div class="mt-2">
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="primavera_verano" {% if bolso.temporada == 'primavera_verano' %}checked{% endif %} />
                      <label class="form-check-label">Primavera/Verano</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="otoño_invierno" {% if bolso.temporada == 'otoño_invierno' %}checked{% endif %} />
                      <label class="form-check-label">Otoño/Invierno</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="temporada" value="todo_el_año" {% if bolso.temporada == 'todo_el_año' %}checked{% endif %} />
                      <label class="form-check-label">Todo el Año</label>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold">Descripción</label>
                  <textarea name="descripcion" class="form-control" rows="3" required>{{ bolso.descripcion }}</textarea>
                </div>

                <div class="col-12 mt-4 pt-3 border-top text-center">
                  <a href="/" class="btn btn-light me-2">Cancelar</a>
                  <button type="submit" class="btn btn-warning px-5 fw-bold shadow-sm">
                    <i class="bi bi-save me-2"></i>Guardar Cambios
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center text-muted py-4">
      <small>&copy; 2026 BagShop</small>
    </footer>
  </body>
</html>
